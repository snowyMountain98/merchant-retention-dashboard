name: Enterprise Retention Analysis and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install analysis dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build enterprise and anomaly metrics from source workbook
        run: >-
          python src/analysis/build_enterprise_dashboard.py
          --input "스타플랫폼거래집계.xlsx"
          --output public-data/dashboard_summary.json

      - name: Generate OpenAI enterprise-only insights
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-luna' }}
        run: >-
          python src/analysis/generate_openai_insights.py
          --input public-data/dashboard_summary.json
          --output public-data/dashboard_summary.json

      - name: Remove individual merchant records and verify masked enterprise names
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('public-data/dashboard_summary.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data.pop('merchants', None)
          for enterprise in data.get('enterprises', []):
              # Always present the original masked enterprise name from the source data.
              enterprise['display_name'] = enterprise.get('enterprise_name', '')
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding='utf-8')
          assert 'merchants' not in data
          assert all(e.get('display_name') == e.get('enterprise_name') for e in data.get('enterprises', []))
          print('Pages data check passed: enterprise-only output and original masked names.')
          PY

      - name: Assemble enterprise-only Pages site without source workbook or search assets
        run: |
          rm -rf site
          mkdir -p site/assets/css site/assets/js site/public-data
          cp index.html site/index.html
          cp company.html site/company.html
          cp assets/css/style.css site/assets/css/style.css
          cp assets/js/dashboard.js site/assets/js/dashboard.js
          cp assets/js/company-detail.js site/assets/js/company-detail.js
          cp public-data/dashboard_summary.json site/public-data/dashboard_summary.json
          test ! -e site/스타플랫폼거래집계.xlsx
          test ! -e site/merchant-detail.html
          test ! -e site/assets/css/company-evidence.css
          test ! -e site/src/analysis/generate_naver_evidence.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
