name: Validate Analysis Code
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Validate synthetic sample aggregation
        run: |
          python - <<'PY'
          import pandas as pd
          from src.analysis.aggregate_monthly import aggregate_monthly
          df = pd.read_csv('data/sample/sample_transactions.csv', dtype='string')
          result = aggregate_monthly(df)
          assert not result.empty
          assert result['approval_amount'].sum() > 0
          print(f'Sample validation passed: {len(result)} merchant-month rows')
          PY
