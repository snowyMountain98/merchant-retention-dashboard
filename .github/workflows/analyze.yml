name: AI Merchant Retention Analysis and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install analysis dependencies
        run: python -m pip install -r requirements.txt

      - name: Run AI scoring unit tests
        run: python -m pytest -q

      - name: Build AI analysis from the uploaded workbook
        run: >-
          python src/analysis/build_dashboard.py
          --input "스타플랫폼거래집계.xlsx"
          --output public-data/dashboard_summary.json

      - name: Assemble Pages site without the source workbook
        run: |
          rm -rf site
          mkdir -p site/public-data
          cp index.html site/index.html
          cp -r assets site/assets
          cp public-data/dashboard_summary.json site/public-data/dashboard_summary.json
          test ! -e site/스타플랫폼거래집계.xlsx

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
